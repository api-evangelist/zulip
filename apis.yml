aid: zulip
name: Zulip
description: Zulip is an open-source team chat application with a unique topic-based threading model. Zulip's APIs power the
  web and mobile apps and provide REST endpoints, incoming webhooks, outgoing webhooks, and event-driven integrations to connect
  Zulip with external services.
type: Index
position: Consumer
access: 3rd-Party
