  name: Zulip REST API
  description: >-
    The Zulip REST API powers the Zulip web and mobile apps. It provides programmatic access to messages,
    streams, users, organizations, and all other Zulip functionality. Anything you can do in Zulip, you
    can do with the REST API.
  humanURL: https://zulip.com/api/rest
  tags:
  - Messaging
  - REST
  - Team Chat
