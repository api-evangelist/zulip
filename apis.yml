- aid: zulip:webhooks
  name: Zulip Webhooks
  description: Zulip supports both incoming webhooks (allowing third-party services to push data to Zulip) and outgoing webhooks
    (allowing Zulip to send HTTP POST payloads to external services when messages are sent).
  humanURL: https://zulip.com/api/incoming-webhooks-overview
