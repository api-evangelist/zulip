  - type: AsyncAPI
    url: asyncapi/zulip-events-asyncapi.yml
- aid: zulip:events-api
  name: Zulip Events API
  description: >-
    The Zulip Events API delivers real-time updates from a Zulip server to a client via an HTTPS long-poll.
    Clients register an event queue via POST /api/v1/register, then call GET /api/v1/events with the returned
    queue_id and last_event_id to receive batches of typed events covering messages, reactions, subscriptions,
    presence, typing, channel/stream changes, user and organization updates, custom emoji, alert words,
    message-flag changes, drafts, scheduled messages, reminders, user groups, and system heartbeat/restart
    signals.
  humanURL: https://zulip.com/api/get-events
  tags:
  - Event
  - Long Polling
  - Real-Time
  - Team Chat
  tags_raw:
  - Events
  - Long Polling
  - Real Time
  - Team Chat
  properties:
