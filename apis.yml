    url: https://zulip.com/api/get-events
  - type: Reference
    url: https://zulip.com/api/real-time-events
  - type: AsyncAPI
    url: asyncapi/zulip-events-asyncapi.yml
- aid: zulip:webhooks
  name: Zulip Webhooks
  description: >-
    Zulip supports both incoming webhooks (allowing third-party services to push data to Zulip) and outgoing
    webhooks (allowing Zulip to send HTTP POST payloads to external services when messages are sent).
  humanURL: https://zulip.com/api/incoming-webhooks-overview
