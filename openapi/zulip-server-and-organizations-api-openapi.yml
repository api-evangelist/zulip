  /server_settings:
    get:
      operationId: get-server-settings
      summary: Get server settings
      tags:
      - server_and_organizations
      x-response-description: "Please note that not all of these attributes are guaranteed to appear in a\nresponse, for two reasons:\n\n* This endpoint has evolved over time, so responses from older Zulip servers\n  might be missing some keys (in which case a client should assume the\n  appropriate default).\n* If a `/server_settings` request is made to the root domain of a\n  multi-subdomain server, like the root domain of zulip.com, the settings\n  that are realm-specific are not known and thus not provided.\n"
      description: "Fetch global settings for a Zulip server.\n\n**Note:** this endpoint does not require any authentication at all, and you can use it to check:\n\n- If this is a Zulip server, and if so, what version of Zulip it's running.\n- What a Zulip client (e.g. a mobile app or\n  [zulip-terminal](https://github.com/zulip/zulip-terminal/)) needs to\n  know in order to display a login prompt for the server (e.g. what\n  authentication methods are available).\n"
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    authentication_methods:
                      type: object
                      additionalProperties: false
                      deprecated: true
                      description: 'Each key-value pair in the object indicates whether the authentication

                        method is enabled on this server.


                        **Changes**: Deprecated in Zulip 2.1.0, in favor of the more expressive

                        `external_authentication_methods`.

                        '
                      properties:
                        password:
                          description: 'Whether the user can authenticate using password.

                            '
                          type: boolean
                        dev:
                          description: 'Whether the user can authenticate using development API key.

                            '
                          type: boolean
                        email:
                          description: 'Whether the user can authenticate using email.

                            '
                          type: boolean
                        ldap:
                          description: 'Whether the user can authenticate using LDAP.

                            '
                          type: boolean
                        remoteuser:
                          description: 'Whether the user can authenticate using REMOTE_USER.

                            '
                          type: boolean
                        github:
                          description: 'Whether the user can authenticate using their GitHub account.

                            '
                          type: boolean
                        azuread:
                          description: 'Whether the user can authenticate using their Microsoft Entra ID account.

                            '
                          type: boolean
                        gitlab:
                          description: 'Whether the user can authenticate using their GitLab account.


                            **Changes**: New in Zulip 3.0 (feature level 1).

                            '
                          type: boolean
                        apple:
                          description: 'Whether the user can authenticate using their Apple account.

                            '
                          type: boolean
                        google:
                          description: 'Whether the user can authenticate using their Google account.

                            '
                          type: boolean
                        saml:
                          description: 'Whether the user can authenticate using SAML.

                            '
                          type: boolean
                        openid connect:
                          description: 'Whether the user can authenticate using OpenID Connect.

                            '
                          type: boolean
                        discord:
                          description: 'Whether the user can authenticate using their Discord account.


                            **Changes**: New in Zulip 12.0 (feature level 488).

                            '
                          type: boolean
                    external_authentication_methods:
                      type: array
                      description: 'A list of dictionaries describing the available external

                        authentication methods (E.g. Google, GitHub, or SAML)

                        enabled for this organization.


                        The list is sorted in the order in which these

                        authentication methods should be displayed.


                        **Changes**: New in Zulip 2.1.0.

                        '
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          name:
                            type: string
                            description: 'A unique, table, machine-readable name for the authentication method,

                              intended to be used by clients with special behavior for specific

                              authentication methods to correctly identify the method.

                              '
                          display_name:
                            type: string
                            description: 'Display name of the authentication method, to be used in all buttons

                              for the authentication method.

                              '
                          display_icon:
                            type: string
                            nullable: true
                            description: 'URL for an image to be displayed as an icon in all buttons for

                              the external authentication method. This URL should be resolved

                              relative to the server''s base URL.


                              When `null`, no icon should be displayed.

                              '
                          login_url:
                            type: string
                            description: 'URL to be used to initiate authentication using this method.

                              '
                          signup_url:
                            type: string
                            description: 'URL to be used to initiate account registration using this method.

                              '
                    zulip_feature_level:
                      type: integer
                      description: 'An integer indicating what features are

                        available on the server. The feature level increases monotonically;

                        a value of N means the server supports all API features introduced

                        before feature level N. This is designed to provide a simple way

                        for client apps to decide whether the server supports a given

                        feature or API change. See the [changelog](/api/changelog) for

                        details on what each feature level means.


                        **Changes**: New in Zulip 3.0 (feature level 1). We recommend using an

                        implied value of 0 for Zulip servers that do not send this field.

                        '
                    zulip_version:
                      type: string
                      description: 'The server''s version number. This is often a release version number,

                        like `2.1.7`. But for a server running a [version from Git][git-release],

                        it will be a Git reference to the commit, like `5.0-dev-1650-gc3fd37755f`.


                        [git-release]: https://zulip.readthedocs.io/en/latest/overview/release-lifecycle.html#git-versions

                        '
                    zulip_merge_base:
                      type: string
                      description: 'The `git merge-base` between `zulip_version` and official branches

                        in the public

                        [Zulip server and web app repository](https://github.com/zulip/zulip),

                        in the same format as `zulip_version`. This will equal

                        `zulip_version` if the server is not running a fork of the Zulip server.


                        This will be `""` if unavailable.


                        **Changes**: New in Zulip 5.0 (feature level 88).

                        '
                    push_notifications_enabled:
                      type: boolean
                      description: 'Whether mobile/push notifications are configured.

                        '
                    is_incompatible:
                      type: boolean
                      description: 'Whether the Zulip client that has sent a request to this endpoint is

                        deemed incompatible with the server.

                        '
                    email_auth_enabled:
                      type: boolean
                      description: 'Setting for allowing users authenticate with an email-password

                        combination.

                        '
                    require_email_format_usernames:
                      type: boolean
                      description: 'Whether all valid usernames for authentication to this

                        organization will be email addresses. This is important

                        for clients to know whether to do client side validation

                        of email address format in a login prompt.


                        This value will be false if the server has [LDAP

                        authentication][ldap-auth] enabled with a username and

                        password combination.


                        [ldap-auth]: https://zulip.readthedocs.io/en/latest/production/authentication-methods.html#ldap-including-active-directory

                        '
                    realm_uri:
                      type: string
                      deprecated: true
                      description: 'The organization''s canonical URL. Alias of `realm_url`.


                        **Changes**: Deprecated in Zulip 9.0 (feature level 257). The term

                        "URI" is deprecated in [web standards](https://url.spec.whatwg.org/#goals).

                        '
                    realm_url:
                      type: string
                      description: 'The organization''s canonical URL.


                        **Changes**: New in Zulip 9.0 (feature level 257), replacing the

                        deprecated `realm_uri`.

                        '
                    realm_name:
                      type: string
                      description: 'The organization''s name (for display purposes).

                        '
                    realm_icon:
                      type: string
                      description: 'The URL for the organization''s logo formatted as a square image,

                        used for identifying the organization in small locations in the

                        mobile and desktop apps.

                        '
                    realm_description:
                      type: string
                      description: 'HTML description of the organization, as configured by the [organization

                        profile](/help/create-your-organization-profile).

                        '
                    realm_web_public_access_enabled:
                      type: boolean
                      description: 'Whether the organization has enabled the creation of

                        [web-public channels](/help/public-access-option) and

                        at least one web-public channel on the server currently

                        exists. Clients that support viewing content

                        in web-public channels without an account can

                        use this to determine whether to offer that

                        feature on the login page for an organization.


                        **Changes**: New in Zulip 5.0 (feature level 116).

                        '
                  example:
                    authentication_methods:
                      password: true
                      dev: true
                      email: true
                      ldap: false
                      remoteuser: false
                      github: true
                      azuread: false
                      google: true
                      saml: true
                    zulip_version: 5.0-dev-1650-gc3fd37755f
                    zulip_merge_base: 5.0-dev-1646-gea6b21cd8c
                    push_notifications_enabled: false
                    msg: ''
                    is_incompatible: false
                    email_auth_enabled: true
                    require_email_format_usernames: true
                    realm_uri: http://localhost:9991
                    realm_url: http://localhost:9991
                    realm_name: Zulip Dev
                    realm_icon: https://secure.gravatar.com/avatar/62429d594b6ffc712f54aee976a18b44?d=identicon
                    realm_description: <p>The Zulip development environment default organization.  It's great for testing!</p>
                    realm_web_public_access_enabled: false
                    result: success
                    external_authentication_methods:
                    - name: saml:idp_name
                      display_name: SAML
                      display_icon: null
                      login_url: /accounts/login/social/saml/idp_name
                      signup_url: /accounts/register/social/saml/idp_name
                    - name: google
                      display_name: Google
                      display_icon: /static/images/authentication_backends/googl_e-icon.png
                      login_url: /accounts/login/social/google
                      signup_url: /accounts/register/social/google
                    - name: github
                      display_name: GitHub
                      display_icon: /static/images/authentication_backends/github-icon.png
                      login_url: /accounts/login/social/github
                      signup_url: /accounts/register/social/github
components:
  schemas:
    JsonSuccessBase:
      description: '**Changes**: As of Zulip 7.0 (feature level 167), if any

        parameters sent in the request are not supported by this

        endpoint, a successful JSON response will include an

        [`ignored_parameters_unsupported`][ignored_params] array.


        A typical successful JSON response may look like:


        [ignored_params]: /api/rest-error-handling#ignored-parameters

        '
      allOf:
      - $ref: '#/components/schemas/JsonResponseBase'
      - required:
        - result
        - msg
        properties:
          result:
            enum:
            - success
          msg:
            type: string
          ignored_parameters_unsupported:
            $ref: '#/components/schemas/IgnoredParametersUnsupported'
    CustomProfileField:
      type: object
      additionalProperties: false
      description: 'Dictionary containing the details of a custom profile field configured

        for this organization.

        '
      properties:
        id:
          type: integer
          description: 'The ID of the custom profile field. This will be referenced in the custom

            profile fields section of user objects.

            '
        type:
          type: integer
          description: 'An integer indicating the type of the custom profile field, which determines

            how it is configured and displayed to users.


            See the [Custom profile fields](/help/custom-profile-fields#profile-field-types)

            article for details on what each type means.


            - **1**: Short text

            - **2**: Paragraph

            - **3**: Dropdown

            - **4**: Date

            - **5**: Link

            - **6**: Users

            - **7**: External account

            - **8**: Pronouns


            **Changes**: Field type `8` added in Zulip 6.0 (feature level 151).

            '
        order:
          type: integer
          description: 'Custom profile fields are displayed in both settings UI and

            UI showing users'' profiles in increasing `order`.

            '
        name:
          type: string
          description: 'The name of the custom profile field.

            '
        hint:
          type: string
          description: 'The help text to be displayed for the custom profile field in user-facing

            settings UI for configuring custom profile fields.

            '
        field_data:
          type: string
          description: 'Field types 3 (Dropdown) and 7 (External account) support storing

            additional configuration for the field type in the `field_data` attribute.


            For field type 3 (Dropdown), this attribute is a JSON dictionary

            defining the choices and the order they will be displayed in the

            dropdown UI for individual users to select an option.


            The interface for field type 7 is not yet stabilized.

            '
        display_in_profile_summary:
          type: boolean
          description: 'Whether the custom profile field, display or not on the user card.


            Must be false for `Users`

            [profile field types](/help/custom-profile-fields#profile-field-types).


            This field is only included when its value is `true`.


            **Changes**: Before Zulip 12.0 (feature level 476), the

            "Paragraph" field type was not supported.


            New in Zulip 6.0 (feature level 146).

            '
          default: false
        required:
          type: boolean
          description: 'Whether an organization administrator has configured this profile field as

            required.


            Because the required property is mutable, clients cannot assume that a required

            custom profile field has a value. The Zulip web application displays a prominent

            banner to any user who has not set a value for a required field.


            **Changes**: New in Zulip 9.0 (feature level 244).

            '
        editable_by_user:
          type: boolean
          description: 'Whether regular users can edit this profile field on their own account.


            Note that organization administrators can edit custom profile fields for any user

            regardless of this setting.


            **Changes**: New in Zulip 10.0 (feature level 296).

            '
          default: true
        use_for_user_matching:
          type: boolean
          description: 'Whether this custom profile field should be used to match users in typeahead

            suggestions. Only allowed for Short Text and External Account

            [profile field types](/help/custom-profile-fields#profile-field-types).


            This field is only included when its value is `true`.


            **Changes**: New in Zulip 12.0 (feature level 455).

            '
          default: false
      required:
      - id
      - type
      - order
      - name
      - hint
      - required
      - editable_by_user
    RealmExport:
      type: object
      additionalProperties: false
      description: 'Object containing details about a

        [data export](/help/export-your-organization).

        '
      properties:
        id:
          type: integer
          description: 'The ID of the data export.

            '
        acting_user_id:
          type: integer
          description: 'The ID of the user who created the data export.

            '
        export_time:
          type: number
          description: 'The UNIX timestamp of when the data export was started.

            '
        deleted_timestamp:
          type: number
          nullable: true
          description: 'The UNIX timestamp of when the data export was deleted.


            Will be `null` if the data export has not been deleted.

            '
        failed_timestamp:
          type: number
          nullable: true
          description: 'The UNIX timestamp of when the data export failed.


            Will be `null` if the data export succeeded, or if it''s

            still being generated.

            '
        export_url:
          type: string
          nullable: true
          description: 'The URL to download the generated data export.


            Will be `null` if the data export failed, or if it''s

            still being generated.

            '
        pending:
          type: boolean
          description: 'Whether the data export is pending, which indicates it

            is still being generated, or if it succeeded, failed or

            was deleted before being generated.


            Depending on the size of the organization, it can take

            anywhere from seconds to an hour to generate the data

            export.

            '
        export_type:
          type: string
          enum:
          - public
          - full_with_consent
          - full_without_consent
          description: "Whether the data export is public, full with consent, or full without consent.\n\n- `public` = Public data export.\n- `full_with_consent` = Public and private data export (with consent), which includes private data\n  for users who have granted consent.\n- `full_without_consent` = All public and private data, which includes private data for all users.\n\n**Changes**: Zulip 12.0 (feature level 449) changed the type of\nthis field from int to string with `1` being replaced by `public` and\n`2` being replaced by `full_with_consent`. The option `full_without_consent`\nwas added for full exports without member consent.\n\n**Changes**: New in Zulip 10.0 (feature level 304). Previously,\nthe export type was not included in these objects because only\npublic data exports could be created or listed via the API or UI.\n"
    EmailAddressVisibility:
      type: integer
      description: 'The [policy][permission-level] for [which other users][help-email-visibility]

        in this organization can see the user''s real email address.


        - 1 = Everyone

        - 2 = Members only

        - 3 = Administrators only

        - 4 = Nobody

        - 5 = Moderators only


        **Changes**: New in Zulip 7.0 (feature level 163), replacing the

        realm-level setting.


        [permission-level]: /api/roles-and-permissions#permission-levels

        [help-email-visibility]: /help/configure-email-visibility

        '
    JsonSuccess:
      allOf:
      - $ref: '#/components/schemas/JsonSuccessBase'
      - additionalProperties: false
        properties:
          result: {}
          msg: {}
          ignored_parameters_unsupported: {}
        example:
          msg: ''
          result: success
    IgnoredParametersSuccess:
      allOf:
      - $ref: '#/components/schemas/IgnoredParametersBase'
      - additionalProperties: false
        properties:
          result: {}
          msg: {}
          ignored_parameters_unsupported: {}
      description: '**Changes**: The [`ignored_parameters_unsupported`][ignored_params]

        array was added as a possible return value for all REST API endpoint

        JSON success responses in Zulip 7.0 (feature level 167).


        Previously, it was added to

        [`POST /users/me/subscriptions/properties`](/api/update-subscription-settings)

        in Zulip 5.0 (feature level 111) and to

        [`PATCH /realm/user_settings_defaults`](/api/update-realm-user-settings-defaults)

        in Zulip 5.0 (feature level 96). The feature was introduced in Zulip 5.0

        (feature level 78) as a return value for the

        [`PATCH /settings`](/api/update-settings) endpoint.


        A typical successful JSON response with ignored parameters may look like:


        [ignored_params]: /api/rest-error-handling#ignored-parameters

        '
      example:
        ignored_parameters_unsupported:
        - invalid_param_1
        - invalid_param_2
        msg: ''
        result: success
    IgnoredParametersBase:
      allOf:
      - $ref: '#/components/schemas/JsonResponseBase'
      - required:
        - result
        - msg
        properties:
          result:
            enum:
            - success
          msg:
            type: string
          ignored_parameters_unsupported:
            $ref: '#/components/schemas/IgnoredParametersUnsupported'
    IgnoredParametersUnsupported:
      type: array
      items:
        type: string
      description: 'An array of any parameters sent in the request that are not

        supported by the endpoint.


        See [error handling](/api/rest-error-handling#ignored-parameters) documentation

        for details on this and its change history.

        '
    CodedErrorBase:
      allOf:
      - $ref: '#/components/schemas/JsonResponseBase'
      - required:
        - result
        - msg
        - code
        properties:
          result:
            enum:
            - error
          msg:
            type: string
          code:
            type: string
            description: 'A string that identifies the error.

              '
    JsonResponseBase:
      type: object
      properties:
        result:
          type: string
    RealmDomain:
      type: object
      additionalProperties: false
      properties:
        domain:
          type: string
          description: 'The allowed domain.

            '
        allow_subdomains:
          type: boolean
          description: 'Whether subdomains are allowed for this domain.

            '
      required:
      - domain
      - allow_subdomains
    LinkifierPattern:
      description: 'The [Python regular

        expression](https://docs.python.org/3/howto/regex.html) that should

        trigger the linkifier.

        '
      type: string
      example: '#(?P<id>[0-9]+)'
    LinkifierURLTemplate:
      description: 'The [RFC 6570](https://www.rfc-editor.org/rfc/rfc6570.html)

        compliant URL template used for the link.

        If you used named groups in `pattern`, you can insert their

        content here with `{name_of_group}`.


        **Changes**: New in Zulip 7.0 (feature level 176). This replaced

        the `url_format_string` parameter, which was a format string in which

        named groups'' content could be inserted with `%(name_of_group)s`.

        '
      type: string
      example: https://github.com/zulip/zulip/issues/{id}
    CodedError:
      allOf:
      - $ref: '#/components/schemas/CodedErrorBase'
      - additionalProperties: false
        properties:
          result: {}
          msg: {}
          code: {}
    RealmEmoji:
      type: object
      additionalProperties: false
      description: 'Object containing details about an emoji. It has the

        following properties:

        '
      properties:
        id:
          type: string
          description: 'The ID for this emoji, same as the object''s key.

            '
        name:
          type: string
          description: 'The user-friendly name for this emoji. Users in the organization

            can use this emoji by writing this name between colons (`:name :`).

            '
        source_url:
          type: string
          description: 'The path relative to the organization''s URL where the

            emoji''s image can be found.

            '
        still_url:
          type: string
          nullable: true
          description: 'Only non-null when the emoji''s image is animated.


            The path relative to the organization''s URL where a still

            (not animated) version of the emoji can be found. (This is

            currently always the first frame of the animation).


            This is useful for clients to display the emoji in contexts

            where continuously animating it would be a bad user experience

            (E.g. because it would be distracting).


            **Changes**: New in Zulip 5.0 (added as optional field in

            feature level 97 and then made mandatory, but nullable, in

            feature level 113).

            '
        deactivated:
          type: boolean
          description: 'Whether the emoji has been deactivated or not.

            '
        author_id:
          type: integer
          nullable: true
          description: 'The user ID of the user who uploaded the custom emoji.

            Will be `null` if the uploader is unknown.


            **Changes**: New in Zulip 3.0 (feature level 7). Previously

            was accessible via an `author` object with an `id` field.

            '
    LegacyPresenceFormat:
      type: object
      description: '`{client_name}` or `"aggregated"`: Object containing the details of the user''s

        presence.


        **Changes**: Starting with Zulip 7.0 (feature level 178), this will always

        contain two keys, `"website"` and `"aggregated"`, with identical data. The

        server no longer stores which client submitted presence updates.


        Previously, the `{client_name}` keys for these objects were the names of the

        different clients where the user was logged in, for example `website` or

        `ZulipDesktop`.

        '
      additionalProperties: false
      properties:
        client:
          type: string
          description: 'The client''s platform name.


            **Changes**: Starting with Zulip 7.0 (feature level 178), this will

            always be `"website"` as the server no longer stores which client

            submitted presence data.

            '
        status:
          type: string
          enum:
          - idle
          - active
          description: 'The status of the user on this client. Will be either `"idle"`

            or `"active"`.

            '
        timestamp:
          type: integer
          description: 'The UNIX timestamp of when this client sent the user''s presence

            to the server with the precision of a second.

            '
        pushable:
          type: boolean
          description: 'Whether the client is capable of showing mobile/push notifications

            to the user.


            Not present in objects with the `"aggregated"` key.


            **Changes**: Starting with Zulip 7.0 (feature level 178), always

            `false` when present as the server no longer stores which client

            submitted presence data.

            '
  responses:
    SuccessIgnoredParameters:
