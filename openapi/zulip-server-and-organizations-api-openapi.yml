              - pattern
              - url_template
            encoding:
              alternative_url_templates:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
  /realm/playgrounds:
    post:
      operationId: add-code-playground
      summary: Add a code playground
      tags:
      - server_and_organizations
      description: 'Configure [code playgrounds](/help/code-blocks#code-playgrounds) for the organization.


        **Changes**: New in Zulip 4.0 (feature level 49). A parameter encoding bug was

        fixed in Zulip 4.0 (feature level 57).

        '
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  description: 'The user-visible display name of the playground which can be

                    used to pick the target playground, especially when multiple

                    playground options exist for that programming language.

                    '
                  type: string
                  example: Python playground
                pygments_language:
                  description: 'The name of the Pygments language lexer for that

                    programming language.

                    '
                  type: string
                  example: Python
                url_template:
                  description: 'The [RFC 6570](https://www.rfc-editor.org/rfc/rfc6570.html)

                    compliant URL template for the playground. The template should

                    contain exactly one variable named `code`, which determines how the

                    extracted code should be substituted in the playground URL.


                    **Changes**: New in Zulip 8.0 (feature level 196). This replaced the

                    `url_prefix` parameter, which was used to construct URLs by just

                    concatenating `url_prefix` and `code`.

                    '
                  type: string
                  example: https://python.example.com?code={code}
              required:
              - name
              - pygments_language
              - url_template
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    id:
                      type: integer
                      description: 'The numeric ID assigned to this playground.

                        '
                  example:
                    id: 1
                    result: success
                    msg: ''
  /realm/playgrounds/{playground_id}:
    delete:
      operationId: remove-code-playground
      summary: Remove a code playground
      tags:
      - server_and_organizations
      description: 'Remove a [code playground](/help/code-blocks#code-playgrounds) previously

        configured for an organization.


        **Changes**: New in Zulip 4.0 (feature level 49).

        '
      parameters:
      - name: playground_id
        in: path
        description: 'The ID of the playground that you want to remove.

          '
        schema:
          type: integer
        example: 1
        required: true
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
  /export/realm:
    get:
      operationId: get-realm-exports
      summary: Get all data exports
      tags:
      - server_and_organizations
      x-requires-administrator: true
      description: 'Fetch all the public and standard [data exports][export-data]

        of the organization.


        **Changes**: Prior to Zulip 10.0 (feature level 304), only

        public data exports could be fetched using this endpoint.


        New in Zulip 2.1.


        [export-data]: /help/export-your-organization#export-data-in-an-importable-format

        '
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    exports:
                      type: array
                      description: 'An array of dictionaries where each dictionary contains

                        details about a data export of the organization.

                        '
                      items:
                        $ref: '#/components/schemas/RealmExport'
                  example:
                    exports:
                    - acting_user_id: 11
                      deleted_timestamp: null
                      export_type: public
                      export_time: 1722243168.134179
                      export_url: http://example.zulipchat.com/user_avatars/exports/2/FprbwiF0c_sCN0O-rf-ryFtc/zulip-export-p6yuxc45.tar.gz
                      id: 323
                      failed_timestamp: null
                      pending: false
                    msg: ''
                    result: success
    post:
      operationId: export-realm
      summary: Create a data export
      tags:
      - server_and_organizations
      x-requires-administrator: true
      description: "Create a public or a standard [data export][export-data] of the organization.\n\n!!! warn \"\"\n\n    **Note**: If you're the administrator of a self-hosted installation,\n    you may be looking for the documentation on [server data export and\n    import][data-export] or [server backups][backups].\n\n**Changes**: Prior to Zulip 10.0 (feature level 304), only\npublic data exports could be created using this endpoint.\n\nNew in Zulip 2.1.\n\n[export-data]: /help/export-your-organization#export-data-in-an-importable-format\n[data-export]: https://zulip.readthedocs.io/en/stable/production/export-and-import.html#data-export\n[backups]: https://zulip.readthedocs.io/en/stable/production/export-and-import.html#backups\n"
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                export_type:
                  description: "Whether the data export should be public, full with consent,\nor full without consent.\n\n- `public` = Public data only export.\n- `full_with_consent` = Public and private data export (with consent), which includes\n  private data for users who have granted consent.\n- `full_without_consent` = All public and private data export, which includes private data for\n  all users. This option requires the organization to have\n  the `owner_full_content_access` feature enabled.\n\nIf not specified, defaults to `public`.\n\n**Changes**: Zulip 12.0 (feature level 449) changed the type of\nthis field from int to string with `1` being replaced by `public` and\n`2` being replaced by `full_with_consent`. The option `full_without_consent`\nwas added for full exports without member consent.\n\n**Changes**: New in Zulip 10.0 (feature level 304). Previously,\nall export requests were public data exports.\n"
                  type: string
                  enum:
                  - public
                  - full_with_consent
                  - full_without_consent
                  default: public
                  example: full_with_consent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    id:
                      type: integer
                      description: 'The ID of the data export created.


                        **Changes**: New in Zulip 7.0 (feature level 182).

                        '
                  example:
                    id: 1
                    result: success
                    msg: ''
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CodedError'
                - example:
                    code: BAD_REQUEST
                    msg: Please request a manual export from zulip-admin@example.com.
                    result: error
                  description: 'An example JSON error response for when the data export

                    exceeds the maximum allowed data export size.

                    '
  /export/realm/consents:
    get:
      operationId: get-realm-export-consents
      summary: Get data export consent state
      tags:
      - server_and_organizations
      x-requires-administrator: true
      description: 'Fetches which users have [consented](/help/export-your-organization#configure-whether-administrators-can-export-your-private-data)

        for their private data to be exported by organization administrators.


        **Changes**: Changes in Zulip 12.0 (feature level 430). Added an

        integer field `email_address_visibility` to the objects in the

        `export_consents` array.


        New in Zulip 10.0 (feature level 295).

        '
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    export_consents:
                      type: array
                      description: 'An array of objects where each object contains a user ID, whether the

                        user has consented for their private data to be exported, and their

                        email visibility policy.

                        '
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          user_id:
                            description: 'The user ID.

                              '
                            type: integer
                          consented:
                            description: 'Whether the user has consented for their private data export.

                              '
                            type: boolean
                          email_address_visibility:
                            $ref: '#/components/schemas/EmailAddressVisibility'
                  example:
                    export_consents:
                    - user_id: 11
                      consented: true
                      email_address_visibility: 1
                    - user_id: 6
                      consented: false
                      email_address_visibility: 2
                    msg: ''
                    result: success
  /realm/test_welcome_bot_custom_message:
