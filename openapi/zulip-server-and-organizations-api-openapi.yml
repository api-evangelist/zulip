  /realm/linkifiers:
    get:
      operationId: get-linkifiers
      summary: Get linkifiers
      tags:
      - server_and_organizations
      description: 'List all of an organization''s configured

        [linkifiers](/help/add-a-custom-linkifier), regular

        expression patterns that are automatically linkified when they appear

        in messages and topics.


        **Changes**: New in Zulip 4.0 (feature level 54). On older versions,

        a similar `GET /realm/filters` endpoint was available with each entry in

        a `[pattern, url_format, id]` tuple format.

        '
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    linkifiers:
                      type: array
                      description: 'An ordered array of objects, where each object

                        describes a linkifier.


                        Clients should always process linkifiers in the order given;

                        this is important if the realm has linkifiers with overlapping

                        patterns. The order can be modified using [`PATCH

                        /realm/linkifiers`](/api/reorder-linkifiers).

                        '
                      items:
                        type: object
                        additionalProperties: false
                        properties:
                          pattern:
                            type: string
                            description: 'The string regex pattern which represents the pattern that

                              should be linkified by this linkifier.

                              '
                          url_template:
                            type: string
                            description: 'The [RFC 6570](https://www.rfc-editor.org/rfc/rfc6570.html) compliant

                              URL template to be used for linkifying matches.


                              **Changes**: New in Zulip 7.0 (feature level 176). This replaced `url_format`,

                              which contained a URL format string.

                              '
                          id:
                            type: integer
                            description: 'The ID of the linkifier.

                              '
                          example_input:
                            type: string
                            nullable: true
                            description: 'An example input string that matches the linkifier''s pattern.

                              This is required for reverse linkifiers.


                              **Changes**: New in Zulip 12.0 (feature level 471).

                              '
                          reverse_template:
                            type: string
                            nullable: true
                            description: 'A simple template using `{variable}` for variables that can

                              be used to generate the Markdown linkifier syntax, given a

                              URL matching the URL template.


                              `{{ "{{/}}" }}` can be used for literal `{/}` characters.


                              **Changes**: New in Zulip 12.0 (feature level 471).

                              '
                          alternative_url_templates:
                            type: array
                            items:
                              type: string
                            description: 'An array of additional [RFC 6570][rfc6570] compliant URL

                              template strings that are used for reverse linkification

                              (converting pasted URLs to linkifier pattern text). These

                              templates have no effect on forward linkification.


                              [rfc6570]: https://www.rfc-editor.org/rfc/rfc6570.html


                              **Changes**: New in Zulip 12.0 (feature level e2b257).

                              '
                  example:
                    msg: ''
                    linkifiers:
                    - pattern: '#(?P<id>[0-9]+)'
                      url_template: https://github.com/zulip/zulip/issues/{id}
                      id: 1
                      example_input: '#1234'
                      reverse_template: '#{id}'
                      alternative_url_templates:
                      - https://github.com/zulip/zulip/pull/{id}
                    result: success
    patch:
      operationId: reorder-linkifiers
      summary: Reorder linkifiers
      tags:
      - server_and_organizations
      description: 'Change the order that the regular expression patterns in the organization''s

        [linkifiers](/help/add-a-custom-linkifier) are matched in messages and topics.

        Useful when defining linkifiers with overlapping patterns.


        **Changes**: New in Zulip 8.0 (feature level 202). Before this feature level,

        linkifiers were always processed in order by ID, which meant users would

        need to delete and recreate them to reorder the list of linkifiers.

        '
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ordered_linkifier_ids:
                  description: 'A list of the IDs of all the linkifiers defined in this

                    organization, in the desired new order.

                    '
                  type: array
                  items:
                    type: integer
                  example:
                  - 3
                  - 2
                  - 1
                  - 5
              required:
              - ordered_linkifier_ids
            encoding:
              ordered_linkifier_ids:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
  /realm/filters:
    post:
      operationId: add-linkifier
      summary: Add a linkifier
      tags:
      - server_and_organizations
      description: 'Configure [linkifiers](/help/add-a-custom-linkifier),

        regular expression patterns that are automatically linkified when they

        appear in messages and topics.

        '
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                pattern:
                  $ref: '#/components/schemas/LinkifierPattern'
                url_template:
                  $ref: '#/components/schemas/LinkifierURLTemplate'
                example_input:
                  type: string
                  nullable: true
                  example: '#1234'
                  description: 'An example input string that matches the linkifier''s pattern.

                    This is required for reverse linkifiers.


                    **Changes**: New in Zulip 12.0 (feature level 471).

                    '
                reverse_template:
                  type: string
                  nullable: true
                  example: '#{id}'
                  description: 'A simple template using `{variable}` for variables that can

                    be used to generate the Markdown linkifier syntax, given a

                    URL matching the URL template.


                    `{{ "{{/}}" }}` can be used for literal `{/}` characters.


                    Server verifies that variables extracted from example_input using

                    url_pattern when passed to reverse_template returns example_input

                    back to us.


                    **Changes**: New in Zulip 12.0 (feature level 471).

                    '
                alternative_url_templates:
                  type: array
                  items:
                    type: string
                  example:
                  - https://github.com/zulip/zulip/pull/{id}
                  description: 'An array of additional [RFC 6570][rfc6570] compliant URL

                    template strings that are used for reverse linkification

                    (converting pasted URLs to linkifier pattern text). These

                    templates have no effect on forward linkification.


                    [rfc6570]: https://www.rfc-editor.org/rfc/rfc6570.html


                    **Changes**: New in Zulip 12.0 (feature level e2b257).

                    '
              required:
              - pattern
              - url_template
            encoding:
              alternative_url_templates:
                contentType: application/json
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/JsonSuccessBase'
                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    id:
                      type: integer
                      description: 'The numeric ID assigned to this filter.

                        '
                  example:
                    id: 42
                    result: success
                    msg: ''
