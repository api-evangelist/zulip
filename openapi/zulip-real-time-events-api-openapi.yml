                        type: array
                        items:
                          oneOf:
                          - type: string
                          - type: integer
                    muted_users:
                      type: array
                      description: 'Present if `muted_users` is present in `fetch_event_types`.


                        A list of dictionaries where each dictionary describes

                        a [muted user](/api/mute-user).


                        **Changes**: New in Zulip 4.0 (feature level 48).

