                        **Changes**: New in Zulip 10.0 (feature level 297).

                        '
                    subscriptions:
                      type: array
                      items:
                        $ref: '#/components/schemas/Subscription'
                      description: 'Present if `subscription` is present in `fetch_event_types`.


