      summary: Delete an event queue
      tags:
      - real_time_events
      description: 'Delete a previously registered queue.

        '
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                queue_id:
                  description: 'The ID of an event queue that was previously registered via

