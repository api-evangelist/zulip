                        Removed `role` field from the dictionary

                        in Zulip 6.0 (feature level 133).

                        '
                    never_subscribed:
                      type: array
                      items:
                        allOf:
                        - $ref: '#/components/schemas/BasicChannelBase'
                        - additionalProperties: false
                          properties:
                            stream_id: {}
