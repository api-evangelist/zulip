                              topic_links: []
                              is_me_message: false
                              reactions: []
                              submessages: []
                              sender_full_name: King Hamlet
                              sender_email: user10@zulip.testserver
                              sender_realm_str: zulip
                              display_recipient: Denmark
                              type: stream
                              stream_id: 1
                              avatar_url: null
                              content_type: text/html
                            flags: []
