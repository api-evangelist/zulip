  /typing:
    post:
      operationId: set-typing-status
      summary: Set "typing" status
      tags:
      - users
      description: "Notify other users whether the current user is\n[typing a message][help-typing].\n\nClients implementing Zulip's typing notifications\nprotocol should work as follows:\n\n- Send a request to this endpoint with `\"op\": \"start\"` when a user\n  starts composing a message.\n- While the user continues to actively type or otherwise interact with\n  the compose UI (e.g. interacting with the compose box emoji picker),\n  send regular `\"op\": \"start\"` requests to this endpoint, using\n  `server_typing_started_wait_period_milliseconds` in the\n  [`POST /register`][api-register] response as the time interval\n  between each request.\n- Send a request to this endpoint with `\"op\": \"stop\"` when a user\n  has stopped using the compose UI for the time period indicated by\n  `server_typing_stopped_wait_period_milliseconds` in the\n  [`POST /register`][api-register] response or when a user\n  cancels the compose action (if it had previously sent a \"start\"\n  notification for that compose action).\n- Start displaying a visual typing indicator for a given conversation\n  when a [`typing op:start`][start-typing] event is received\n  from the server.\n- Continue displaying a visual typing indicator for the conversation\n  until a [`typing op:stop`][stop-typing] event is received\n  from the server or the time period indicated by\n  `server_typing_started_expiry_period_milliseconds` in the\n  [`POST /register`][api-register] response has passed without\n  a new `typing \"op\": \"start\"` event for the conversation.\n\nThis protocol is designed to allow the server-side typing notifications\nimplementation to be stateless while being resilient as network failures\nwill not result in a user being incorrectly displayed as perpetually\ntyping.\n\nSee the subsystems documentation on [typing indicators][typing-protocol-docs]\nfor additional design details on Zulip's typing notifications protocol.\n\n**Changes**: Clients shouldn't care about the APIs prior to Zulip 8.0 (feature level 215)\nfor channel typing notifications, as no client actually implemented\nthe previous API for those.\n\nSupport for displaying channel typing notifications was new\nin Zulip 4.0 (feature level 58). Clients should indicate they support\nprocessing channel typing notifications via the `stream_typing_notifications`\nvalue in the `client_capabilities` parameter of the\n[`POST /register`][client-capabilities] endpoint.\n\n[help-typing]: /help/typing-notifications\n[api-register]: /api/register-queue\n[start-typing]: /api/get-events#typing-start\n[stop-typing]: /api/get-events#typing-stop\n[client-capabilities]: /api/register-queue#parameter-client_capabilities\n[typing-protocol-docs]: https://zulip.readthedocs.io/en/latest/subsystems/typing-indicators.html\n"
      x-curl-examples-parameters:
        oneOf:
        - type: exclude
          parameters:
            enum:
            - topic
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type:
                  description: 'Type of the message being composed.


                    **Changes**: In Zulip 9.0 (feature level 248), `"channel"` was added as

                    an additional value for this parameter to indicate a channel message is

                    being composed.


                    In Zulip 8.0 (feature level 215), stopped supporting

                    `"private"` as a valid value for this parameter.


                    In Zulip 7.0 (feature level 174), `"direct"` was added

                    as the preferred way to indicate a direct message is being composed,

                    becoming the default value for this parameter and deprecating the

                    original `"private"`.


                    New in Zulip 4.0 (feature level 58). Previously, typing notifications

                    were only for direct messages.

                    '
                  type: string
                  enum:
                  - direct
                  - stream
                  - channel
                  default: direct
                  example: direct
                op:
                  description: 'Whether the user has started (`"start"`) or stopped (`"stop"`) typing.

                    '
                  type: string
                  enum:
                  - start
                  - stop
                  example: start
                to:
                  description: 'User IDs of the recipients of the message being typed. Required for the

                    `"direct"` type. Ignored in the case of `"stream"` or `"channel"` type.


                    Clients should send a JSON-encoded list of user IDs, even if there is only

                    one recipient.


                    **Changes**: In Zulip 8.0 (feature level 215), stopped using this parameter

                    for the `"stream"` type. Previously, in the case of the `"stream"` type, it

                    accepted a single-element list containing the ID of the channel. A new parameter,

                    `stream_id`, is now used for this. Note that the `"channel"` type did not

                    exist at this feature level.


                    Support for typing notifications for channel'' messages

                    is new in Zulip 4.0 (feature level 58). Previously, typing

                    notifications were only for direct messages.


                    Before Zulip 2.0.0, this parameter accepted only a JSON-encoded

                    list of email addresses. Support for the email address-based format was

                    removed in Zulip 3.0 (feature level 11).

                    '
                  type: array
                  items:
                    type: integer
                  minLength: 1
                  example:
                  - 9
                  - 10
                stream_id:
                  description: 'ID of the channel in which the message is being typed. Required for the `"stream"`

                    or `"channel"` type. Ignored in the case of `"direct"` type.


                    **Changes**: New in Zulip 8.0 (feature level 215). Previously, a single-element

                    list containing the ID of the channel was passed in `to` parameter.

                    '
                  type: integer
                  example: 7
                topic:
                  description: 'Topic to which message is being typed. Required for the `"stream"` or `"channel"`

                    type. Ignored in the case of `"direct"` type.


                    Note: When `"(no topic)"` or the value of `realm_empty_topic_display_name`

                    found in the [POST /register](/api/register-queue) response is used for this

                    parameter, it is interpreted as an empty string.


                    **Changes**: Before Zulip 10.0 (feature level 372),

                    `"(no topic)"` was not interpreted as an empty string.


                    Before Zulip 10.0 (feature level 334), empty string

                    was not a valid topic name for channel messages.


                    New in Zulip 4.0 (feature level 58). Previously, typing notifications

                    were only for direct messages.

                    '
                  type: string
                  example: typing notifications
              required:
              - op
            encoding:
              to:
                contentType: application/json
              stream_id:
                contentType: application/json
      responses:
        '200':
          $ref: '#/components/responses/SimpleSuccess'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CodedError'
                - example:
                    code: BAD_REQUEST
                    msg: Missing channel ID
                    result: error
                  description: 'An example JSON error response when the user composes a channel message

                    and `stream_id` is not specified:

                    '
