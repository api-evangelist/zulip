                - additionalProperties: false
                  properties:
                    result: {}
                    msg: {}
                    ignored_parameters_unsupported: {}
                    subgroups:
                      type: array
                      items:
                        type: integer
                      description: 'A list containing the IDs of subgroups of the user group.

                        '
                  example:
                    msg: ''
                    result: success
                    subgroups:
                    - 2
                    - 3
