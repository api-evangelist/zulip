  /users/{email}:
    get:
      operationId: get-user-by-email
      summary: Get a user by email
      tags:
      - users
      description: 'Fetch details for a single user in the organization given a Zulip

        API email address.


        You can also fetch details on [all users in the organization](/api/get-users)

        or [by user ID](/api/get-user).


        Fetching by user ID is generally recommended when possible,

        as a user might [change their email address](/help/change-your-email-address)

        or change their [email address visibility](/help/configure-email-visibility),

        either of which could change the client''s ability to look them up by that

        email address.


        **Changes**: In Zulip 12.0 (feature level 437), fixed a bug

        dating to feature level 232, which caused guest users to

        receive fake backwards-compatibility users in the format

        intended for clients using `POST /register` without the

        `user_list_incomplete` client capability.


        Starting with Zulip 10.0 (feature level 302), the real email

        address can be used in the `email` parameter and will fetch the target user''s

        data if and only if the target''s email visibility setting permits the requester

        to see the email address.

        The dummy email addresses of the form `user{id}@{realm.host}` still work, and

        will now work for **all** users, via identifying them by the embedded user ID.


        New in Zulip Server 4.0 (feature level 39).

        '
      x-curl-examples-parameters:
        oneOf:
        - type: include
          parameters:
            enum:
            - ''
        - type: exclude
          parameters:
            enum:
            - ''
          description: 'You may pass the `client_gravatar` or `include_custom_profile_fields` query parameter as follows:

            '
      parameters:
      - name: email
        in: path
        description: "The email address of the user to fetch. Two forms are supported:\n\n- The real email address of the user (`delivery_email`). The lookup will\n  succeed if and only if the user exists and their email address visibility\n  setting permits the client to see the email address.\n\n- The dummy Zulip API email address of the form `user{user_id}@{realm_host}`. This\n  is identical to simply [getting user by ID](/api/get-user). If the server or\n  realm change domains, the dummy email address used has to be adjustment to\n  match the new realm domain. This is legacy behavior for\n  backwards-compatibility, and will be removed in a future release.\n\n**Changes**: Starting with Zulip 10.0 (feature level 302), lookups by real email\naddress match the semantics of the target's email visibility setting and dummy\nemail addresses work for all users, independently of their email visibility\nsetting.\n\nPreviously, lookups were done only using the Zulip API email addresses.\n"
        schema:
          type: string
        example: iago@zulip.com
        required: true
      - $ref: '#/components/parameters/ClientGravatar'
      - $ref: '#/components/parameters/IncludeCustomProfileFields'
